# main에 push하면 Firebase Hosting(one-more-zero.web.app)에 자동 배포
# 필요한 것: GitHub 저장소 Settings → Secrets → Actions 에 FIREBASE_SERVICE_ACCOUNT 이름으로 서비스 계정 키 JSON 전체
# 키를 못 찾으면 배포만 건너뛰고 노란 경고를 남김
name: Firebase Hosting 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 서비스 계정 키 확인
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.ONE_MORE_ZERO || secrets.ONEMOREZERO }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"; echo "서비스 계정 키를 찾았어요"
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT 비밀값이 없어서 배포를 건너뛰었어요"
          fi
      - name: Firebase에 배포
        if: steps.key.outputs.ok == 'yes'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.ONE_MORE_ZERO || secrets.ONEMOREZERO }}
          projectId: morning-trader
          channelId: live
